[build]
  command = "python3 build/build.py"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/daten/*"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

[functions]
  directory = "netlify/functions"
